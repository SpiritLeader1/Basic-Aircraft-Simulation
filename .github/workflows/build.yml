name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  SDL2_VERSION: 2.30.9   # check https://github.com/libsdl-org/SDL/releases for the latest 2.x

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 libsdl2-dev

      - name: Build (Linux)
        run: |
          mkdir -p dist/linux
          g++ -O2 -std=c++17 sim.cpp -o dist/linux/sim $(sdl2-config --cflags --libs)
          cp startFlightGear.sh dist/linux/

      - name: Package (Linux)
        run: tar -czf sim-linux.tar.gz -C dist/linux .

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: sim-linux
          path: sim-linux.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Download SDL2 (MinGW dev package)
        run: |
          curl -L -o sdl2-mingw.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz
          tar -xzf sdl2-mingw.tar.gz
          echo "SDL2_MINGW=$PWD/SDL2-${SDL2_VERSION}/x86_64-w64-mingw32" >> $GITHUB_ENV

      - name: Build (Windows)
        run: |
          mkdir -p dist/windows
          x86_64-w64-mingw32-g++ -O2 -std=c++17 sim.cpp -DSDL_MAIN_HANDLED \
            -I"$SDL2_MINGW/include/SDL2" -I"$SDL2_MINGW/include" \
            -L"$SDL2_MINGW/lib" \
            -lmingw32 -lSDL2main -lSDL2 -lws2_32 \
            -static-libgcc -static-libstdc++ \
            -o dist/windows/sim.exe
          cp "$SDL2_MINGW/bin/SDL2.dll" dist/windows/
          cp startFlightGear.bat dist/windows/
          # cp -r assets dist/linux/ && cp -r assets dist/windows/   # if you have resources

      - name: Package (Windows)
        run: cd dist/windows && zip -r ../../sim-windows.zip .

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: sim-windows
          path: sim-windows.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sim-linux.tar.gz
            dist/sim-windows.zip 
